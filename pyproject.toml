[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-lmm-gwes"
version = "0.6.3"
description = "Standalone low-rank h2-capped LMM pairwise pangenome GWES with PAN-GWES metadata-aware plotting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Seungwon Ko / ChatGPT"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9"
]

[project.scripts]
pair-lmm-gwes = "pair_lmm_gwes.cli:main"
pair-lmm-gwes-plot = "pair_lmm_gwes.plot_cli:main"
pair-lmm-gwes-plot-test = "pair_lmm_gwes.plot_test_cli:main"
pair-lmm-gwes-build-nj-tree = "pair_lmm_gwes.nj_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pair_lmm_gwes*"]

[tool.setuptools.package-data]
pair_lmm_gwes = ["scripts/*.R"]
