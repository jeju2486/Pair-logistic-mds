[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-variation"
version = "0.9.1"
description = "KOVAR: phylogeny-adjusted pangenome covariation score testing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Seungwon Ko"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "threadpoolctl>=2.2"
]

[project.urls]
Repository = "https://github.com/jeju2486/Pair-logistic-mds"

[project.optional-dependencies]
network = ["matplotlib>=3.6", "networkx>=2.8"]
phenotype = ["matplotlib>=3.6", "biopython>=1.81", "scikit-learn>=1.3"]
audit = ["biopython>=1.81", "pyahocorasick>=2.1"]

[project.scripts]
ko-variation = "ko_variation.cli:main"
ko-variation-discover = "ko_variation.discovery:main"
ko-variation-plot = "ko_variation.plot_cli:main"
ko-variation-annotation = "ko_variation.annotation_cli:main"
ko-variation-select = "ko_variation.selection_cli:main"
ko-variation-map-loci = "ko_variation.annotation_inputs:main"
ko-variation-network = "ko_variation.network_cli:main"
ko-variation-prepare-proteins = "ko_variation.functional_annotation:main"
ko-variation-amr-report = "ko_variation.amr_report:main"
ko-variation-phenotype = "ko_variation.phenotype:main"
ko-variation-fastbaps = "ko_variation.fastbaps:main"
ko-variation-unitig-audit = "ko_variation.unitig_audit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ko_variation*"]

[tool.setuptools.package-data]
ko_variation = ["scripts/*.R", "templates/*.html", "vendor/*.js", "vendor/*LICENSE*", "data/*.tsv"]
