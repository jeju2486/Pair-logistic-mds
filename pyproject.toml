[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-variation"
version = "0.8.2"
description = "KOVAR: directional pangenome covariation with logistic mixed models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Seungwon Ko"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "threadpoolctl>=2.2"
]

[project.urls]
Repository = "https://github.com/jeju2486/Pair-logistic-mds"

[project.scripts]
ko-variation = "ko_variation.cli:main"
ko-variation-plot = "ko_variation.plot_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ko_variation*"]

[tool.setuptools.package-data]
ko_variation = ["scripts/*.R"]
