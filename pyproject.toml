[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-mds-gwes"
version = "0.1.4"
description = "MDS-corrected bidirectional logistic tester for PAN-GWES/SpydrPick candidate pairs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Seungwon Ko"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "statsmodels>=0.13"
]

[project.optional-dependencies]
tree = ["biopython>=1.80"]

[project.scripts]
pair-mds-gwes = "pair_mds_gwes.cli:main"
pair-mds-gwes-plot = "pair_mds_gwes.plot_cli:main"

[tool.setuptools]
packages = ["pair_mds_gwes"]

[tool.setuptools.package-data]
pair_mds_gwes = ["scripts/*.R"]
