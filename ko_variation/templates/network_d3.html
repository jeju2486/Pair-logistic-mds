<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
body{margin:0;background:#fff;color:#253041;font:14px system-ui,Arial}header{padding:12px 18px;border-bottom:1px solid #e2e6eb;display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,button{padding:7px 10px;border:1px solid #cfd5dd;border-radius:5px;background:white;color:#253041}button:hover{background:#edf1f5}#counts{margin-left:auto;font-size:12px}main{display:flex;height:calc(100vh - 70px)}#chart{flex:1;min-width:0}svg{width:100%;height:100%;touch-action:none}aside{width:270px;padding:16px;border-left:1px solid #e2e6eb;overflow:auto;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}#tip{position:fixed;pointer-events:none;display:none;background:#fff;border:1px solid #cfd5dd;border-radius:5px;padding:10px;max-width:350px;white-space:pre-wrap;font-size:12px;box-shadow:0 2px 8px #0002}.hover-label{font:12px system-ui;fill:#253041;paint-order:stroke;stroke:white;stroke-width:3px;pointer-events:none}.node,.edge{cursor:pointer}.edge{fill:none}.edge:hover{stroke-opacity:1}@media(max-width:800px){aside{width:180px}header{padding:8px}main{height:80vh}}
</style></head><body>
<header><input id="search" aria-label="Search gene" placeholder="Search gene or identifier"><button id="clear">Clear selection</button><button id="reflow">Compact / reflow</button><button id="freeze">Freeze</button><button id="reset">Reset layout</button><label><input id="labels" type="checkbox"> Gene labels</label><button id="saveSvg">SVG</button><button id="savePng">PNG</button><button id="saveJson">Layout JSON</button><span id="counts"></span></header>
<main><div id="chart"><svg id="canvas" role="img" aria-label="Distal gene covariation network"></svg></div><aside><b>Gene covariation</b><p>Scroll to zoom; drag to pan. Select a gene to highlight its direct neighbours. Drag a node to reposition it.</p><p>Spacing and width represent the representative locus pair's |β|. Graphical positions are not genomic coordinates.</p><p id="tiers"></p><pre id="details">Hover or select a node or edge.</pre></aside></main><div id="tip"></div>
<script id="data" type="application/json">__DATA__</script><script>__D3__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent);
const nodes=data.nodes, edges=data.edges, meta=data.meta;
const initial=new Map(nodes.map(n=>[n.gene,{x:n.x,y:n.y}]));
const byId=new Map(nodes.map(n=>[n.gene,n]));
const adjacent=new Map(nodes.map(n=>[n.gene,new Set([n.gene])]));
edges.forEach(e=>{e.source=byId.get(e.gene_a);e.target=byId.get(e.gene_b);adjacent.get(e.gene_a).add(e.gene_b);adjacent.get(e.gene_b).add(e.gene_a);});
const svg=d3.select('#canvas').attr('viewBox',`0 0 ${meta.width} ${meta.height+90}`);
svg.append('style').text('.hover-label{font:12px system-ui;fill:#253041;paint-order:stroke;stroke:white;stroke-width:3px}.edge{fill:none}');
const scene=svg.append('g'), edgeLayer=scene.append('g'), nodeLayer=scene.append('g'), labelLayer=scene.append('g');
const legend=svg.append('g').attr('class','map-legend').attr('transform',`translate(0,${meta.height})`);
legend.append('rect').attr('width',meta.width).attr('height',90).attr('fill','white');
let lx=12, ly=18;for(const direction of Object.keys(meta.colors).filter(k=>edges.some(e=>e.adjusted_direction===k))){if(lx+95>meta.width){lx=12;ly+=22;}legend.append('line').attr('x1',lx).attr('x2',lx+18).attr('y1',ly).attr('y2',ly).attr('stroke',meta.colors[direction]).attr('stroke-width',2).attr('stroke-dasharray',['mixed','unknown'].includes(direction)?'4,3':null);legend.append('text').attr('x',lx+23).attr('y',ly+4).attr('font-size',11).text(direction);lx+=95;}
const fmt=x=>x==null?'unestimated':Number(x).toPrecision(4);
const tierText=meta.strength_cutoffs?`|representative β|: weak ≤ ${fmt(meta.strength_cutoffs[0])}; medium > ${fmt(meta.strength_cutoffs[0])} to ${fmt(meta.strength_cutoffs[1])}; strong > ${fmt(meta.strength_cutoffs[1])}`:'No finite representative coefficients';
document.getElementById('tiers').textContent=tierText+` (${meta.cutoff_mode==='fixed'?'fixed boundaries':'within-map tertiles'}).`;
let legendY=ly+26;
function legendText(text){let line='',t=legend.append('text').attr('x',12).attr('y',legendY).attr('font-size',9);for(const word of text.split(' ')){const next=line?line+' '+word:word;t.text(next);if(t.node().getComputedTextLength()>meta.width-24&&line){t.text(line);legendY+=14;t=legend.append('text').attr('x',12).attr('y',legendY).attr('font-size',9).text(word);line=word;}else line=next;}legendY+=18;}
legendText(tierText);
legendText('Spacing/width: representative |β|; node size: degree; positions are diagram coordinates.');
const legendHeight=legendY+8;legend.select('rect').attr('height',legendHeight);svg.attr('viewBox',`0 0 ${meta.width} ${meta.height+legendHeight}`);
document.getElementById('counts').textContent=`${nodes.length} genes · ${edges.length} edges`;
const zoom=d3.zoom().scaleExtent([.1,20]).on('zoom',event=>scene.attr('transform',event.transform));svg.call(zoom);
let simulation=null, selected=null, hovered=null;
const paths=edgeLayer.selectAll('path').data(edges).join('path').attr('class','edge').attr('stroke',e=>e.color).attr('stroke-width',e=>e.display_width).attr('stroke-opacity',.7).attr('stroke-dasharray',e=>['mixed','unknown'].includes(e.adjusted_direction)?'4,3':null);
const circles=nodeLayer.selectAll('circle').data(nodes).join('circle').attr('class','node').attr('r',n=>n.radius).attr('fill',n=>n.color).attr('stroke','white').attr('stroke-width',.6);
function nodeInfo(n){return `Gene: ${n.display_label||n.gene}\nGene ID: ${n.gene}\nAliases: ${n.label}\nProduct: ${n.product||'unavailable'}\nDegree: ${n.degree}\nSupporting locus pairs: ${n.n_supporting_pairs}`;}
function edgeInfo(e){return `${e.gene_a} — ${e.gene_b}\nAdjusted association direction: ${e.adjusted_direction}\nMagnitude category: ${e.strength_category}\nRepresentative β: ${fmt(e.representative_adjusted_beta)}\nRepresentative SE: ${fmt(e.representative_adjusted_beta_se)}\nRepresentative odds ratio: ${fmt(e.representative_adjusted_odds_ratio)}\nRepresentative locus P: ${fmt(e.representative_significance)}\nMinimum supporting locus P: ${fmt(e.min_significance)}\nRepresentative physical distance (bp): ${fmt(e.representative_physical_distance)}\nSupporting locus pairs: ${e.n_locus_pairs}\nRepresentative loci: ${e.representative_u}, ${e.representative_v}`;}
function tip(event,text){const el=document.getElementById('tip');el.textContent=text;el.style.display='block';el.style.left=Math.min(event.clientX+12,window.innerWidth-370)+'px';el.style.top=Math.max(8,Math.min(event.clientY+12,window.innerHeight-240))+'px';}
function hideTip(){document.getElementById('tip').style.display='none';}
function updateLabels(){const showAll=document.getElementById('labels').checked;const visible=nodes.filter(n=>(showAll||n.gene===selected||n.gene===hovered)&&(n.display_label||n.gene===selected||n.gene===hovered));labelLayer.selectAll('text').data(visible,n=>n.gene).join('text').attr('class','hover-label').attr('x',n=>n.x+n.radius+3).attr('y',n=>n.y-4).text(n=>n.display_label||n.gene);}
function tick(){paths.attr('d',e=>e.source===e.target?`M${e.source.x},${e.source.y} c-18,-30 18,-30 0,0`:`M${e.source.x},${e.source.y} L${e.target.x},${e.target.y}`);circles.attr('cx',n=>n.x).attr('cy',n=>n.y);updateLabels();}
// Selection is a post-construction display overlay; it never adds/removes edges.
function selectGene(gene){selected=gene;const active=gene?adjacent.get(gene):null;circles.attr('opacity',n=>!active||active.has(n.gene)?1:.15).attr('fill',n=>n.gene===gene?'#E69F00':n.color).attr('stroke',n=>n.gene===gene?'#253041':'white');paths.attr('stroke-opacity',e=>!gene? .7:(e.gene_a===gene||e.gene_b===gene? .95:.08));updateLabels();}
circles.on('pointerenter',(event,n)=>{hovered=n.gene;tip(event,nodeInfo(n));updateLabels();}).on('pointermove',(event,n)=>tip(event,nodeInfo(n))).on('pointerleave',()=>{hovered=null;hideTip();updateLabels();}).on('click',(event,n)=>{event.stopPropagation();selectGene(n.gene);document.getElementById('details').textContent=nodeInfo(n);});
paths.on('pointerenter',(event,e)=>tip(event,edgeInfo(e))).on('pointermove',(event,e)=>tip(event,edgeInfo(e))).on('pointerleave',hideTip).on('click',(event,e)=>{event.stopPropagation();document.getElementById('details').textContent=edgeInfo(e);});
circles.call(d3.drag().on('start',(event,n)=>{event.sourceEvent.stopPropagation();n.fx=n.x;n.fy=n.y;}).on('drag',(event,n)=>{n.x=event.x;n.y=event.y;n.fx=n.x;n.fy=n.y;tick();}).on('end',()=>tick()));
function freeze(){if(simulation)simulation.stop();nodes.forEach(n=>{n.fx=n.x;n.fy=n.y;});}
document.getElementById('reflow').onclick=()=>{nodes.forEach(n=>{n.fx=null;n.fy=null;});if(simulation)simulation.stop();simulation=d3.forceSimulation(nodes).randomSource(d3.randomLcg(meta.seed)).force('links',d3.forceLink(edges).id(n=>n.gene).distance(e=>e.target_link_distance).strength(e=>({strong:.8,medium:.5,weak:.2,unestimated:.3})[e.strength_category])).force('charge',d3.forceManyBody().strength(-8)).force('collision',d3.forceCollide(n=>n.radius+1.5).iterations(3)).force('componentX',d3.forceX(n=>n.component_x).strength(.15)).force('componentY',d3.forceY(n=>n.component_y).strength(.15)).on('tick',tick);};
document.getElementById('freeze').onclick=freeze;
document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';selectGene(null);document.getElementById('details').textContent='Hover or select a node or edge.';};
document.getElementById('reset').onclick=()=>{freeze();nodes.forEach(n=>{Object.assign(n,initial.get(n.gene));n.fx=null;n.fy=null;});selectGene(null);svg.call(zoom.transform,d3.zoomIdentity);tick();};
document.getElementById('labels').onchange=updateLabels;
document.getElementById('search').oninput=event=>{const q=event.target.value.trim().toLowerCase();const found=q?nodes.find(n=>(n.gene+' '+n.label).toLowerCase().includes(q)):null;selectGene(found?.gene||null);document.getElementById('details').textContent=found?nodeInfo(found):q?'No matching gene.':'Hover or select a node or edge.';};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function svgSource(){freeze();const box=scene.node().getBBox(),left=Math.min(0,box.x-12),top=Math.min(0,box.y-12),bottom=Math.max(meta.height,box.y+box.height+12),width=Math.max(meta.width,box.x+box.width+12)-left,height=bottom+legendHeight-top;const copy=svg.node().cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');copy.setAttribute('width',width);copy.setAttribute('height',height);copy.setAttribute('viewBox',`${left} ${top} ${width} ${height}`);copy.querySelector('g').removeAttribute('transform');const footer=copy.querySelector('.map-legend');footer.setAttribute('transform',`translate(${left},${bottom})`);footer.querySelector('rect').setAttribute('width',width);return {source:new XMLSerializer().serializeToString(copy),width,height};}
document.getElementById('saveSvg').onclick=()=>download(new Blob([svgSource().source],{type:'image/svg+xml'}),'covariation_map.svg');
document.getElementById('savePng').onclick=()=>{const saved=svgSource(),blob=new Blob([saved.source],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=Math.ceil(saved.width*3);canvas.height=Math.ceil(saved.height*3);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(png=>download(png,'covariation_map.png'));URL.revokeObjectURL(url);};img.src=url;};
document.getElementById('saveJson').onclick=()=>{freeze();const saved={nodes:nodes.map(({index,vx,vy,fx,fy,...n})=>n),edges:edges.map(({source,target,index,...e})=>e),meta:{...meta,layout_method:'saved interactive D3 coordinates'}};download(new Blob([JSON.stringify(saved)],{type:'application/json'}),'covariation_map.layout.json');};
tick();
</script></body></html>
